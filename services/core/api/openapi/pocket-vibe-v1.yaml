openapi: 3.1.0
info:
  title: Pocket Vibe Mock API
  version: 0.3.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service status
  /auth/login:
    post:
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: Login success with session token
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      summary: Logout and destroy session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout success
        "401":
          description: Not authenticated
  /auth/me:
    get:
      summary: Get current user info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
        "401":
          description: Not authenticated
  /mock/repos:
    get:
      summary: List local fixture repos for the walking skeleton
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Mock repo list
  /files/tree:
    get:
      summary: List the local fixture file tree for a project
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: File tree
  /files/content:
    get:
      summary: Read a local fixture file
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
        - name: filePath
          in: query
          schema:
            type: string
      responses:
        "200":
          description: File content
  /reader/payload:
    get:
      summary: Build a reader payload from the fixture repo
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
        - name: filePath
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Reader payload
  /search:
    get:
      summary: Search fixture repo files
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
        - name: query
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Search results
  /capabilities:
    get:
      summary: Report baseline project capabilities
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Capability status
  /context/resolve:
    post:
      summary: Resolve context chips before asking AI
      responses:
        "200":
          description: Resolved context preview
  /chat/sessions:
    post:
      summary: Create a chat session
      responses:
        "201":
          description: Chat session
  /chat/sessions/{sessionId}/events:
    get:
      summary: Stream a mock chat answer with tool events
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: question
          in: query
          schema:
            type: string
      responses:
        "200":
          description: SSE stream
  /notes:
    get:
      summary: List notes for a project
      responses:
        "200":
          description: Note list
    post:
      summary: Save a note with source anchors
      responses:
        "201":
          description: Saved note
  /notes/{noteId}:
    get:
      summary: Read one note
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Note detail
  /saved-answers:
    get:
      summary: List saved answers for a project
      responses:
        "200":
          description: Saved answer list
    post:
      summary: Save an AI answer snapshot
      responses:
        "201":
          description: Saved answer
  /annotations:
    get:
      summary: List annotations for a project
      responses:
        "200":
          description: Annotation list
    post:
      summary: Save an annotation
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Annotation

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token obtained from /auth/login
